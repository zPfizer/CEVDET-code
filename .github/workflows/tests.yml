name: CEVDET checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cevdet-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install native Codex CLI for executable discovery test
        run: npm install --global @openai/codex@0.153.4
      - name: Synthetic test suite
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python -B -X utf8 -m unittest discover -s .codex/tests -q

  posix-process-tests:
    name: Process tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Real POSIX process contract
        working-directory: .codex/tests
        run: python -B -X utf8 -m unittest test_codex_brain.ProcessControlTests test_concurrency_process.PosixCleanupContractTests -v
